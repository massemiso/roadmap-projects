<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <header class="bg-primary text-white p-4 mb-4">
      <div class="container d-flex justify-content-between align-items-center">
        <h1>Personal Blog Dashboard</h1>
        <a href="/new" class="btn btn-light">+ Add Article</a>
      </div>
    </header>
    <div class="container mb-3">
      <a href="/home" class="btn btn-outline-primary">Return to Home</a>
    </div>
    <main class="container">
      <nav>
        <ul class="list-group">
          <li class="list-group-item d-flex justify-content-between align-items-center" th:each="article:${articles}">
            <a class="text-decoration-none h5 mb-0" th:href="@{/article/{id}(id=${article.id})}" th:text="${article.title}"></a>
            <div>
              <a class="btn btn-sm btn-outline-secondary me-2" th:href="@{/edit/{id}(id=${article.id})}">Edit</a>
              <a class="btn btn-sm btn-outline-danger" th:href="@{/delete/{id}(id=${article.id})}">Delete</a>
            </div>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
