<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <header class="bg-primary text-white p-4 mb-4">
      <div class="container d-flex justify-content-between align-items-center">
        <h1>Personal Blog</h1>
        <a href="/admin" class="btn btn-outline-light">Admin Login</a>
      </div>
    </header>
    <main class="container">
      <div class="container mb-4">
        <form th:action="@{/home}" method="get" class="row g-3">
          <div class="col-auto">
            <input type="text" name="title" class="form-control" placeholder="Filter by title..." th:value="${articleFilterDto.title}">
          </div>
          <div class="col-auto">
            <input type="date" name="dateOfPublication" class="form-control" th:value="${articleFilterDto.dateOfPublication}">
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-primary">Filter</button>
            <a href="/home" class="btn btn-secondary">Clear</a>
          </div>
        </form>
      </div>

      <div class="list-group">
        <a th:each="article:${articles}" th:href="@{/article/{id}(id=${article.id})}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
          <h5 class="mb-1" th:text="${article.title}"></h5>
          <small class="text-muted" th:text="${article.dop}"></small>
        </a>
      </div>

      <!-- Pagination Controls -->
      <nav class="mt-4" th:if="${pageTotal > 1}">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:classappend="${pageNumber == 0} ? 'disabled'">
            <a class="page-link" th:href="@{/home(page=${pageNumber - 1}, title=${articleFilterDto.title}, dateOfPublication=${articleFilterDto.dateOfPublication})}">Previous</a>
          </li>
          <li class="page-item disabled">
            <span class="page-link" th:text="|Page ${pageNumber + 1} of ${pageTotal}|"></span>
          </li>
          <li class="page-item" th:classappend="${pageNumber + 1 == pageTotal} ? 'disabled'">
            <a class="page-link" th:href="@{/home(page=${pageNumber + 1}, title=${articleFilterDto.title}, dateOfPublication=${articleFilterDto.dateOfPublication})}">Next</a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
