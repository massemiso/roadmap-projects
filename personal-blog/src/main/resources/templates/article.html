<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="|Article ${dto.id}|" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <header class="bg-primary text-white p-4 mb-4">
      <div class="container">
        <h1 th:text="${dto.title}"></h1>
      </div>
    </header>
    <main class="container bg-white p-4 rounded shadow-sm">
      <article>
        <p class="lead" th:utext="${dto.content}"></p>
      </article>
      <hr />
      <footer>
        <p class="text-muted" th:text="'Published on: ' + ${dto.dop}"></p>
        <a href="/home" class="btn btn-outline-primary btn-sm"
          >Go back to home</a
        >
      </footer>
    </main>
  </body>
</html>
