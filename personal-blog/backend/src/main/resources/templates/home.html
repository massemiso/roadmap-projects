<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <header class="bg-primary text-white p-4 mb-4">
      <div class="container">
        <h1>Personal Blog</h1>
      </div>
    </header>
    <main class="container">
      <div class="list-group">
        <a th:each="article:${articles}" th:href="@{/article/{id}(id=${article.id})}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
          <h5 class="mb-1" th:text="${article.title}"></h5>
          <small class="text-muted" th:text="${article.dop}"></small>
        </a>
      </div>
    </main>
  </body>
</html>
