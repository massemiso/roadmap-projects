spring.application.name=weather-api

# EXTERNAL API
visualcrossing.api.key=${VISUALCROSSING_API_KEY}
visualcrossing.url=https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline

# REDIS
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.cache.type=redis

# LIMITS
# requests
bucket4j.rate.limit=${BUCKET4J_RATE_LIMIT:50}
# minutes
redis.ttl.duration=${REDIS_TTL_DURATION:720}
