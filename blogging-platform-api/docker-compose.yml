services:
  database:
    image: "postgres:17"
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blogging_platform
    volumes:
      - ./db-data/:/var/lib/postgresql/data/
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blogging-platform
    depends_on:
      - database
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/blogging_platform
      - SPRING_DATASOURCE_USERNAME=username
      - SPRING_DATASOURCE_PASSWORD=password