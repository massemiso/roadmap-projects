<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Converter</title>
    <style>
      /* Optional: Basic structural spacing just to see your sections clearly */
      body {
        font-family: sans-serif;
        margin: 2rem;
      }
      section {
        margin-bottom: 2.5rem;
        padding: 1rem;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      label {
        display: inline-block;
        width: 100px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Measurement Unit Converter</h1>
    </header>

    <main>
      <section id="length-converter">
        <h2>Length Converter</h2>
        <form id="length-form" target="_self">
          <div class="form-group">
            <label for="length-value">Value:</label>
            <input
              type="number"
              id="length-value"
              step="any"
              placeholder="Enter number..."
              required
            />
          </div>

          <div class="form-group">
            <label for="length-from">From:</label>
            <select id="length-from">
              <option value="mm">Millimeter</option>
              <option value="cm">Centimeter</option>
              <option value="m">Meter</option>
              <option value="km">Kilometer</option>
              <option value="in">Inch</option>
              <option value="ft">Foot</option>
              <option value="yd">Yard</option>
              <option value="mi">Mile</option>
            </select>
          </div>

          <div class="form-group">
            <label for="length-to">To:</label>
            <select id="length-to">
              <option value="mm">Millimeter</option>
              <option value="cm">Centimeter</option>
              <option value="m" selected>Meter</option>
              <option value="km">Kilometer</option>
              <option value="in">Inch</option>
              <option value="ft">Foot</option>
              <option value="yd">Yard</option>
              <option value="mi">Mile</option>
            </select>
          </div>

          <button type="submit">Convert</button>
        </form>
        <p>Result: <strong id="length-result">--</strong></p>
      </section>

      <section id="weight-converter">
        <h2>Weight Converter</h2>
        <form id="weight-form">
          <div class="form-group">
            <label for="weight-value">Value:</label>
            <input
              type="number"
              id="weight-value"
              step="any"
              placeholder="Enter number..."
              required
            />
          </div>

          <div class="form-group">
            <label for="weight-from">From:</label>
            <select id="weight-from">
              <option value="mg">Milligram</option>
              <option value="g">Gram</option>
              <option value="kg">Kilogram</option>
              <option value="oz">Ounce</option>
              <option value="lb">Pound</option>
            </select>
          </div>

          <div class="form-group">
            <label for="weight-to">To:</label>
            <select id="weight-to">
              <option value="mg">Milligram</option>
              <option value="g">Gram</option>
              <option value="kg" selected>Kilogram</option>
              <option value="oz">Ounce</option>
              <option value="lb">Pound</option>
            </select>
          </div>

          <button type="submit">Convert</button>
        </form>
        <p>Result: <strong id="weight-result">--</strong></p>
      </section>

      <section id="temperature-converter">
        <h2>Temperature Converter</h2>
        <form id="temperature-form">
          <div class="form-group">
            <label for="temperature-value">Value:</label>
            <input
              type="number"
              id="temperature-value"
              step="any"
              placeholder="Enter number..."
              required
            />
          </div>

          <div class="form-group">
            <label for="temperature-from">From:</label>
            <select id="temperature-from">
              <option value="C">Celsius</option>
              <option value="F">Fahrenheit</option>
              <option value="K">Kelvin</option>
            </select>
          </div>

          <div class="form-group">
            <label for="temperature-to">To:</label>
            <select id="temperature-to">
              <option value="C">Celsius</option>
              <option value="F" selected>Fahrenheit</option>
              <option value="K">Kelvin</option>
            </select>
          </div>

          <button type="submit">Convert</button>
        </form>
        <p>Result: <strong id="temperature-result">--</strong></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
