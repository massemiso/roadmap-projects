<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Converter</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .form-control,
      .form-select {
        background-color: #f8f9fa;
        border: 1px solid #adb5bd;
      }
      .form-control:focus,
      .form-select:focus {
        background-color: #ffffff;
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
      }
    </style>
  </head>
  <body class="bg-light">
    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div
            class="card shadow-lg p-3 bg-body-secondary border border-secondary-subtle"
          >
            <div class="card-body">
              <h1 class="card-title mb-4">Unit Converter</h1>

              <ul class="nav nav-pills mb-4">
                <li class="nav-item">
                  <button
                    class="nav-link active"
                    onclick="showConverter('length-converter')"
                  >
                    Length
                  </button>
                </li>
                <li class="nav-item">
                  <button
                    class="nav-link"
                    onclick="showConverter('weight-converter')"
                  >
                    Weight
                  </button>
                </li>
                <li class="nav-item">
                  <button
                    class="nav-link"
                    onclick="showConverter('temperature-converter')"
                  >
                    Temperature
                  </button>
                </li>
              </ul>

              <section id="length-converter">
                <form id="length-form" target="_self">
                  <div class="mb-3">
                    <label for="length-value" class="form-label"
                      >Enter the length to convert:</label
                    >
                    <input
                      type="number"
                      id="length-value"
                      class="form-control"
                      step="any"
                      placeholder="Enter number..."
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label for="length-from" class="form-label"
                      >Unit to Convert from:</label
                    >
                    <select id="length-from" class="form-select">
                      <option value="mm">Millimeter</option>
                      <option value="cm">Centimeter</option>
                      <option value="m">Meter</option>
                      <option value="km">Kilometer</option>
                      <option value="in">Inch</option>
                      <option value="ft">Foot</option>
                      <option value="yd">Yard</option>
                      <option value="mi">Mile</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="length-to" class="form-label"
                      >Unit to Convert to:</label
                    >
                    <select id="length-to" class="form-select">
                      <option value="mm">Millimeter</option>
                      <option value="cm">Centimeter</option>
                      <option value="m" selected>Meter</option>
                      <option value="km">Kilometer</option>
                      <option value="in">Inch</option>
                      <option value="ft">Foot</option>
                      <option value="yd">Yard</option>
                      <option value="mi">Mile</option>
                    </select>
                  </div>
                  <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                      Convert
                    </button>
                    <button type="reset" class="btn btn-secondary">
                      Reset
                    </button>
                  </div>
                </form>
                <div class="mt-3 border-top pt-3">
                  <div class="text-muted">Result:</div>
                  <div class="fs-3 fw-bold text-primary" id="length-result">
                    Enter a value to convert
                  </div>
                </div>
              </section>

              <section id="weight-converter" class="d-none">
                <form id="weight-form">
                  <div class="mb-3">
                    <label for="weight-value" class="form-label"
                      >Enter the weight to convert:</label
                    >
                    <input
                      type="number"
                      id="weight-value"
                      class="form-control"
                      step="any"
                      placeholder="Enter number..."
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label for="weight-from" class="form-label"
                      >Unit to Convert from:</label
                    >
                    <select id="weight-from" class="form-select">
                      <option value="mg">Milligram</option>
                      <option value="g">Gram</option>
                      <option value="kg">Kilogram</option>
                      <option value="oz">Ounce</option>
                      <option value="lb">Pound</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="weight-to" class="form-label"
                      >Unit to Convert to:</label
                    >
                    <select id="weight-to" class="form-select">
                      <option value="mg">Milligram</option>
                      <option value="g">Gram</option>
                      <option value="kg" selected>Kilogram</option>
                      <option value="oz">Ounce</option>
                      <option value="lb">Pound</option>
                    </select>
                  </div>
                  <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                      Convert
                    </button>
                    <button type="reset" class="btn btn-secondary">
                      Reset
                    </button>
                  </div>
                </form>
                <div class="mt-3 border-top pt-3">
                  <div class="text-muted">Result:</div>
                  <div class="fs-3 fw-bold text-primary" id="weight-result">
                    Enter a value to convert
                  </div>
                </div>
              </section>

              <section id="temperature-converter" class="d-none">
                <form id="temperature-form">
                  <div class="mb-3">
                    <label for="temperature-value" class="form-label"
                      >Enter the temperature to convert:</label
                    >
                    <input
                      type="number"
                      id="temperature-value"
                      class="form-control"
                      step="any"
                      placeholder="Enter number..."
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label for="temperature-from" class="form-label"
                      >Unit to Convert from:</label
                    >
                    <select id="temperature-from" class="form-select">
                      <option value="C">Celsius</option>
                      <option value="F">Fahrenheit</option>
                      <option value="K">Kelvin</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="temperature-to" class="form-label"
                      >Unit to Convert to:</label
                    >
                    <select id="temperature-to" class="form-select">
                      <option value="C">Celsius</option>
                      <option value="F" selected>Fahrenheit</option>
                      <option value="K">Kelvin</option>
                    </select>
                  </div>
                  <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                      Convert
                    </button>
                    <button type="reset" class="btn btn-secondary">
                      Reset
                    </button>
                  </div>
                </form>
                <div class="mt-3 border-top pt-3">
                  <div class="text-muted">Result:</div>
                  <div
                    class="fs-3 fw-bold text-primary"
                    id="temperature-result"
                  >
                    Enter a value to convert
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
    <script>
      function showConverter(id) {
        document
          .querySelectorAll("main section")
          .forEach((s) => s.classList.add("d-none"));
        document.getElementById(id).classList.remove("d-none");
        document.querySelectorAll(".nav-link").forEach((link) => {
          link.classList.remove("active");
          if (link.textContent.trim().toLowerCase() === id.split("-")[0]) {
            link.classList.add("active");
          }
        });
      }
    </script>
  </body>
</html>
